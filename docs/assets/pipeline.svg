<title id="t">ransomware-tracker pipeline</title><desc id="d">Ten stages from request to answer: intent routing, collection from all relevant sources with a fallback ladder, normalization, filtering, enrichment, merging, correlation, a coverage gate that can send the run back to collection, and the final answer with a source-status table.</desc>
